# Corehold PC (games/towerdef-pc-0001): headless Windows + Linux export.
# Adapted from abarichello/godot-ci .github/workflows/godot-ci.yml (MIT,
# third_party/licenses/abarichello-godot-ci.LICENSE). Steam upload (steamcmd +
# SteamPipe depot VDFs) is a manual step and needs secrets; not done here.
# NOTE: requires a barichello/godot-ci image tag matching GODOT_VERSION; if
# 4.6.3 is not published yet, build the image from that repo's Dockerfile with
# --build-arg GODOT_VERSION=4.6.3.
name: "towerdef-pc export"
on:
  workflow_dispatch:
  push:
    paths:
      - "games/towerdef-pc-0001/**"

env:
  GODOT_VERSION: 4.6.3
  EXPORT_NAME: Corehold
  PROJECT_PATH: games/towerdef-pc-0001

jobs:
  export:
    strategy:
      matrix:
        include:
          - preset: "Windows Desktop"
            dir: windows
            file: Corehold.exe
          - preset: "Linux"
            dir: linux
            file: Corehold.x86_64
    name: ${{ matrix.preset }} export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          [ -d /root/.config/godot ] && mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Import + self-test
        run: |
          cd $PROJECT_PATH
          godot --headless --import
          godot --headless --script res://selftest.gd
      - name: Export
        run: |
          mkdir -v -p build/${{ matrix.dir }}
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "${{ matrix.preset }}" "$EXPORT_DIR/${{ matrix.dir }}/${{ matrix.file }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: corehold-${{ matrix.dir }}
          path: build/${{ matrix.dir }}
